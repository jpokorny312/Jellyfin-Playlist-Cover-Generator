name: Release

# Runs when a tag like v0.2.0 is created – by `git push origin v0.2.0` or by publishing a
# new release with that tag in the GitHub UI. Attaches the plugin ZIP and manifest.json to
# the release (creating it if needed); the manifest is the Jellyfin plugin repository served
# at .../releases/latest/download/manifest.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Derive version from tag (v0.2.0 -> 0.2.0.0)
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          case "$TAG" in
            *.*.*.*) VERSION="$TAG" ;;
            *) VERSION="$TAG.0" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build
        run: ./build.sh "$VERSION"

      - name: Update manifest
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Take the manifest of the newest *other* release that has one. ("releases/latest" is not
          # reliable here: a release created in the GitHub UI is already "latest" before it has a manifest.)
          rm -f dist/previous.json
          for tag in $(gh release list --repo "$REPO" --limit 30 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            if gh release download "$tag" --repo "$REPO" --pattern manifest.json --output dist/previous.json 2>/dev/null; then
              echo "previous manifest from $tag"
              break
            fi
          done
          [ -f dist/previous.json ] || echo '[]' > dist/previous.json
          python3 scripts/update_manifest.py dist/previous.json dist/manifest.json "$VERSION" \
            "dist/playlist-covers_${VERSION}.zip" \
            "https://github.com/$REPO/releases/download/$GITHUB_REF_NAME/playlist-covers_${VERSION}.zip" \
            "Release $GITHUB_REF_NAME"
          cat dist/manifest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=("dist/playlist-covers_${VERSION}.zip" dist/manifest.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Playlist Covers $GITHUB_REF_NAME" \
              --notes "Plugin für Jellyfin 12.1. Installation: siehe README."
          fi
